<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG@BGG_Comics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 40px; color: #333; font-size: 2.5em; }
        
        .gallery {
            display: grid;
            gap: 30px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }

        .card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #e0e0e0;
        }

        .card-title {
            padding: 16px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 500;
            font-size: 0.95em;
            line-height: 1.4;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* 移动设备 */
        @media (max-width: 600px) {
            .gallery { grid-template-columns: 1fr; gap: 20px; }
            h1 { font-size: 1.8em; margin-bottom: 30px; }
        }

        /* 平板 */
        @media (min-width: 600px) and (max-width: 1000px) {
            .gallery { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 TG@BGG_Comics</h1>
        <div class="gallery">
        <a href="pages/1.html" class="card">
            <div class="card-image" style="display: flex; align-items: center; justify-content: center; font-size: 3em;">📄</div>
            <div class="card-title">秘書艦鹿島の報告書 4</div>
        </a>
        <a href="pages/2.html" class="card">
            <div class="card-image" style="display: flex; align-items: center; justify-content: center; font-size: 3em;">📄</div>
            <div class="card-title">お姉ちゃんと、ママと、本気交尾</div>
        </a>
        </div>
    </div>
</body>
</html>
